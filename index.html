// YouTube API setup
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

var player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytPlayer', {
    playerVars: {
      autoplay: 1,
      controls: 1,
      modestbranding: 1,
      rel: 0
    },
    events: {
      'onReady': onPlayerReady
    }
  });
}

function onPlayerReady() {
  try {
    player.playVideo();
  } catch (err) {
    // ignore
  }

  document.getElementById('playBtn').addEventListener('click', () => player.playVideo());
  document.getElementById('pauseBtn').addEventListener('click', () => player.pauseVideo());
  document.getElementById('muteBtn').addEventListener('click', function () {
    if (player.isMuted()) {
      player.unMute();
      this.textContent = 'Mute';
    } else {
      player.mute();
      this.textContent = 'Unmute';
    }
  });
}

const memberList = document.getElementById("memberList");
const searchBar = document.querySelector(".search-bar");

function renderMembers(filteredMembers) {
  memberList.innerHTML = "";

  // Group members by exact role text
  const roles = {};
  filteredMembers.forEach(member => {
    if (!roles[member.role]) roles[member.role] = [];
    roles[member.role].push(member);
  });

  // Loop through roles in order of appearance
  Object.entries(roles).forEach(([role, membersByRole]) => {
    // Role heading
    const roleSection = document.createElement("div");
    roleSection.style.width = "100%";
    roleSection.style.textAlign = "center";
    roleSection.style.margin = "50px 0 20px";
    roleSection.innerHTML = `<h2 class="role-heading">${role}</h2>`;
    memberList.appendChild(roleSection);

    // Container for members under this role
    const roleGroup = document.createElement("div");
    roleGroup.classList.add("members-group");
    roleGroup.style.display = "flex";
    roleGroup.style.flexWrap = "wrap";
    roleGroup.style.justifyContent = "center";
    roleGroup.style.gap = "20px";
    roleGroup.style.marginBottom = "30px";

    membersByRole.forEach((member, index) => {
      const div = document.createElement("div");
      div.classList.add("member");
      // stagger animation
      div.style.animationDelay = `${index * 0.08}s`;

      div.innerHTML = `
        <img src="${member.profilePicture}" alt="${member.name}" class="profile-pic">
        <div class="member-info">
          <div class="member-name">${member.name}</div>
          <div class="member-role">${member.role}</div>
          ${
            member.facebook !== 'X'
              ? `
                <a href="${member.facebook}" target="_blank" class="facebook-link">
                  <span class="facebook-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <path d="M22 12C22 6.48 17.52 2 12 2S2 6.48 2 12c0 4.84 3.44 8.86 7.94 9.77V14.89H7.9v-2.89h2.05V9.62c0-2.03 1.2-3.15 3.03-3.15.88 0 1.8.16 1.8.16v1.98h-1.01c-0.99 0-1.3.62-1.3 1.26v1.5h2.22l-0.35 2.89h-1.87V21.8C18.56 20.86 22 16.84 22 12z"/>
                    </svg>
                  </span>
                </a>
              `
              : `<span style="color:#aaa;"></span>`
          }
        </div>
      `;
      roleGroup.appendChild(div);
    });

    memberList.appendChild(roleGroup);
  });
}

// แสดงสมาชิกทั้งหมดตอนโหลด

// search
searchBar.addEventListener("input", e => {
  const searchText = e.target.value.toLowerCase();
  const filtered = members.filter(m =>
    m.name.toLowerCase().includes(searchText) ||
    m.role.toLowerCase().includes(searchText)
  );
  renderMembers(filtered);
});
