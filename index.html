<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="Style.css">
  <!-- add fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
  <!-- changed title to uppercase -->
  <title>STEPINTER Members</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      background: url('https://i.imgur.com/Oyy1f9K.png') no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      position: relative;
      overflow-x: hidden;
    }

    /* COOL "Gangster modern" header (tweaked) */
    header {
      position: absolute;
      top: 47px;
      left: 30px;
      font-size: 4vw;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-family: "Oswald", "Poppins", Arial, sans-serif;
      color: transparent;
      background: linear-gradient(90deg, #fff 0%, #00e0ff 45%, #0077ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 0.8px rgba(0,0,0,0.35);
      text-shadow: 0 6px 18px rgba(0,0,0,0.7),
                   0 2px 0 rgba(255,255,255,0.03),
                   0 0 20px rgba(0,224,255,0.06);
      transform: skewX(-3deg);
      user-select: none;
      transition: transform 220ms ease, text-shadow 220ms ease;
    }

    header::after {
      content: "";
      display: block;
      width: 60%;
      height: 4px;
      margin-top: 8px;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(0,224,255,0.35));
      border-radius: 2px;
      transform: skewX(-3deg);
      opacity: 0.95;
    }

    header:hover {
      transform: skewX(0deg) scale(1.03);
      text-shadow: 0 10px 30px rgba(0,0,0,0.75),
                   0 3px 0 rgba(255,255,255,0.06),
                   0 0 28px rgba(0,224,255,0.12);
    }

    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .container {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15vh;
      width: 90%;
      max-width: 600px;
    }

    .logo {
      width: 50%;
      max-width: 300px;
      margin-bottom: 25px;
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
      }
    }

    .search-bar {
      width: 90%;
      max-width: 400px;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      outline: none;
      text-align: center;
      background: rgba(0,0,0,0.5);
      color: #fff;
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .search-bar:focus {
      background: rgba(0,0,0,0.7);
      animation: glowPulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      from { box-shadow: 0 0 5px #1877F2; }
      to   { box-shadow: 0 0 18px #00e0ff; }
    }

    .members {
      margin-top: 50px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 95%;
      max-width: 1200px;
      padding-bottom: 50px;
    }

    .member {
      background-color: rgba(255, 255, 255, 0.15);
      padding: 15px 20px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      width: 320px;
      min-height: 120px;
      transition: transform 0.2s;
      flex: 1 1 300px;
      /* animation start state */
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 0.45s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .member:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .profile-pic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-right: 15px;
      flex-shrink: 0;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .member:hover .profile-pic {
      transform: translateY(-3px) rotate(-3deg);
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* Role heading slides in from left */
    .role-heading {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid white;
      display: inline-block;
      padding-bottom: 6px;
      opacity: 0;
      transform: translateX(-20px);
      animation: slideInRole 0.5s ease forwards;
    }

    @keyframes slideInRole {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .music-player {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    .music-player button {
      background: #444;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .music-player button:active {
      transform: scale(0.94);
    }

    iframe {
      display: none;
    }

    @media (max-width: 768px) {
      header {
        font-size: 6vw;
      }
      .container {
        margin-top: 10vh;
      }
      .logo {
        width: 60%;
      }
      .search-bar {
        width: 95%;
      }
      .member {
        width: 90%;
        flex-direction: row;
        min-height: 100px;
      }
    }

    @media (max-width: 480px) {
      header {
        font-size: 8vw;
      }
      .logo {
        width: 70%;
      }
      .member {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .profile-pic {
        margin-right: 0;
        margin-bottom: 10px;
      }
      .member-info {
        align-items: center;
      }
    }
  </style>
</head>

      player = new YT.Player('ytPlayer', {
        playerVars: {
          autoplay: 1, // request autoplay
          controls: 1,
          modestbranding: 1,
          rel: 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady() {
      // Try to autoplay on ready. Browsers อาจบล็อคเสียง
      try {
        player.playVideo();
      } catch (err) {
        // ignore
      }

      document.getElementById('playBtn').addEventListener('click', () => player.playVideo());
      document.getElementById('pauseBtn').addEventListener('click', () => player.pauseVideo());
      document.getElementById('muteBtn').addEventListener('click', function () {
        if (player.isMuted()) {
          player.unMute();
          this.textContent = 'Mute';
        } else {
          player.mute();
          this.textContent = 'Unmute';
        }
      });
    }

    const memberList = document.getElementById("memberList");
    const searchBar = document.querySelector(".search-bar");

    function renderMembers(filteredMembers) {
      memberList.innerHTML = "";

      // Group members by exact role text (no merging)
      const roles = {};
      filteredMembers.forEach(member => {
        if (!roles[member.role]) roles[member.role] = [];
        roles[member.role].push(member);
      });

      // Loop through roles in order of appearance
      Object.entries(roles).forEach(([role, membersByRole]) => {
        // Create the role heading ABOVE the profiles
        const roleSection = document.createElement("div");
        roleSection.style.width = "100%";
        roleSection.style.textAlign = "center";
        roleSection.style.margin = "50px 0 20px";
        roleSection.innerHTML = `<h2 class="role-heading">${role}</h2>`;
        memberList.appendChild(roleSection);

        // Create a container for the members of this role
        const roleGroup = document.createElement("div");
        roleGroup.classList.add("members-group");
        roleGroup.style.display = "flex";
        roleGroup.style.flexWrap = "wrap";
        roleGroup.style.justifyContent = "center";
        roleGroup.style.gap = "20px";
        roleGroup.style.marginBottom = "30px";

        membersByRole.forEach((member, index) => {
          const div = document.createElement("div");
          div.classList.add("member");
          // staggered delay for smoother entrance
          div.style.animationDelay = `${index * 0.08}s`;

          div.innerHTML = `
            <img src="${member.profilePicture}" alt="${member.name}" class="profile-pic">
            <div class="member-info">
              <div class="member-name">${member.name}</div>
              <div class="member-role">${member.role}</div>
              ${
                member.facebook !== 'X'
                  ? `
                    <a href="${member.facebook}" target="_blank" class="facebook-link">
                      <span class="facebook-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                          <path d="M22 12C22 6.48 17.52 2 12 2S2 6.48 2 12c0 4.84 3.44 8.86 7.94 9.77V14.89H7.9v-2.89h2.05V9.62c0-2.03 1.2-3.15 3.03-3.15.88 0 1.8.16 1.8.16v1.98h-1.01c-0.99 0-1.3.62-1.3 1.26v1.5h2.22l-0.35 2.89h-1.87V21.8C18.56 20.86 22 16.84 22 12z"/>
                        </svg>
                      </span>
                    </a>
                  `
                  : `<span style="color:#aaa;"></span>`
              }
            </div>
          `;
          roleGroup.appendChild(div);
        });

        // Append all members below the role title
        memberList.appendChild(roleGroup);
      });
    }

    // แสดงสมาชิกทั้งหมดตอนแรก
    renderMembers(members);

    // Search filter
    searchBar.addEventListener("input", e => {
      const searchText = e.target.value.toLowerCase();
      const filtered = members.filter(m =>
        m.name.toLowerCase().includes(searchText) ||
        m.role.toLowerCase().includes(searchText)
      );
      renderMembers(filtered);
    });
