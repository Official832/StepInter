<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StepInter Members</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            background: url('https://i.imgur.com/Oyy1f9K.png') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        header {
            position: absolute;
            top: 47px;
            left: 30px;
            font-size: 4vw;
            font-weight: 700;
            letter-spacing: 2px;
            color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .container {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15vh;
            width: 90%;
            max-width: 600px;
        }

        .logo {
            width: 50%;
            max-width: 300px;
            margin-bottom: 25px;
        }

        .search-bar {
            width: 90%;
            max-width: 400px;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .members {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            padding-bottom: 50px;
        }

        .member {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            width: 320px;
            min-height: 120px;
            transition: transform 0.2s;
            flex: 1 1 300px;
        }

        .member:hover {
            transform: scale(1.03);
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .member-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            word-break: break-word;
        }

        .member-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .member-role {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 6px;
        }

        .facebook-link {
            color: white;
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s;
        }

        .facebook-link:hover {
            color: #1877F2;
            /* turns blue on hover */
            text-decoration: underline;
        }

        .facebook-link:hover {
            text-decoration: underline;
        }

        /* Fixed music control box */
        .music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .music-player button {
            background: #444;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .music-player button:hover {
            background: #666;
        }

        iframe {
            display: none;
        }

        @media (max-width: 768px) {
            header {
                font-size: 6vw;
            }

            .container {
                margin-top: 10vh;
            }

            .logo {
                width: 60%;
            }

            .search-bar {
                width: 95%;
            }

            .member {
                width: 90%;
                flex-direction: row;
                min-height: 100px;
            }
        }

        @media (max-width: 480px) {
            header {
                font-size: 8vw;
            }

            .logo {
                width: 70%;
            }

            .member {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .profile-pic {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .member-info {
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="top-nav"></div>
    <header>StepInter</header>

    <div class="container">
        <img src="https://i.imgur.com/kyOH3WH.png" alt="Logo" class="logo" />
        <input type="text" class="search-bar" placeholder="Search members..." />
    </div>

    <div class="members" id="memberList"></div>

    <!-- Hidden YouTube player -->
    <iframe id="ytPlayer" src="https://www.youtube.com/embed/PC-eXgmHkFA?enablejsapi=1"
        allow="autoplay; encrypted-media" frameborder="0"></iframe>

    <!-- Fixed music player controls -->
    <div class="music-player">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
        <button id="muteBtn">Mute</button>
    </div>

    <script>
        // YouTube API setup
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady() {
            document.getElementById('playBtn').addEventListener('click', () => player.playVideo());
            document.getElementById('pauseBtn').addEventListener('click', () => player.pauseVideo());
            document.getElementById('muteBtn').addEventListener('click', function () {
                if (player.isMuted()) {
                    player.unMute();
                    this.textContent = 'Mute';
                } else {
                    player.mute();
                    this.textContent = 'Unmute';
                }
            });
        }

        // Your members list & search logic
        const members = [

            { id: 24, name: 'Armin Stepdekbad', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=61555313676708', profilePicture: 'YOUR_IMGUR_LINK_HERE' },
            { id: 25, name: 'Snow Sabudbob', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=61575196988156', profilePicture: 'YOUR_IMGUR_LINK_HERE' },
            { id: 26, name: 'Simon Simon Simon', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=61564171884806', profilePicture: 'YOUR_IMGUR_LINK_HERE' },
            { id: 27, name: 'Ape Winterfell Zera', role: 'Member', facebook: 'https://www.facebook.com/Ape.Zera', profilePicture: 'YOUR_IMGUR_LINK_HERE' },
        ];

        const memberList = document.getElementById("memberList");
        const searchBar = document.querySelector(".search-bar");

        function renderMembers(filteredMembers) {
            memberList.innerHTML = "";

            // Group members by exact role text (no merging)
            const roles = {};
            filteredMembers.forEach(member => {
                if (!roles[member.role]) roles[member.role] = [];
                roles[member.role].push(member);
            });

            // Loop through roles in order of appearance
            Object.entries(roles).forEach(([role, membersByRole]) => {
                // Create the role heading ABOVE the profiles
                const roleSection = document.createElement("div");
                roleSection.style.width = "100%";
                roleSection.style.textAlign = "center";
                roleSection.style.margin = "50px 0 20px";

                roleSection.innerHTML = `
            <h2 style="
                font-size: 1.8rem;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                border-bottom: 2px solid white;
                display: inline-block;
                padding-bottom: 6px;
            ">${role}</h2>
        `;
                memberList.appendChild(roleSection);

                // Create a container for the members of this role
                const roleGroup = document.createElement("div");
                roleGroup.classList.add("members-group");
                roleGroup.style.display = "flex";
                roleGroup.style.flexWrap = "wrap";
                roleGroup.style.justifyContent = "center";
                roleGroup.style.gap = "20px";
                roleGroup.style.marginBottom = "30px";

                membersByRole.forEach(member => {
                    const div = document.createElement("div");
                    div.classList.add("member");

                    div.innerHTML = `
                <img src="${member.profilePicture}" alt="${member.name}" class="profile-pic">
                <div class="member-info">
                    <div class="member-name">${member.name}</div>
                    <div class="member-role">${member.role}</div>
                    ${member.facebook !== 'X'
                            ? `<a href="${member.facebook}" target="_blank" class="facebook-link">${member.facebook}</a>`
                            : `<span style="color:#aaa;"> </span>`}
                </div>
            `;
                    roleGroup.appendChild(div);
                });

                // Append all members below the role title
                memberList.appendChild(roleGroup);
            });
        }



        renderMembers(members);

        searchBar.addEventListener("input", e => {
            const searchText = e.target.value.toLowerCase();
            const filtered = members.filter(m =>
                m.name.toLowerCase().includes(searchText) ||
                m.role.toLowerCase().includes(searchText)
            );
            renderMembers(filtered);
        });
    </script>
</body>

</html>
