<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StepInter Members</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            background: url('https://i.imgur.com/AgBQgKi.jpg') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        header {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 4vw;
            font-weight: 700;
            letter-spacing: 2px;
            color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        .container {
            text-align: center;
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15vh;
            width: 90%;
            max-width: 600px;
        }

        .logo {
            width: 50%;
            max-width: 300px;
            margin-bottom: 25px;
        }

        .search-bar {
            width: 90%;
            max-width: 400px;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .members {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            padding-bottom: 50px;
        }

        /* Rectangle member card */
        .member {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            width: 320px;
            min-height: 120px;
            transition: transform 0.2s;
            flex: 1 1 300px;
        }

        .member:hover {
            transform: scale(1.03);
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .member-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            word-break: break-word;
        }

        .member-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .member-role {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 6px;
        }

        .facebook-link {
            color: #1877F2;
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
        }

        .facebook-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header {
                font-size: 6vw;
            }

            .container {
                margin-top: 10vh;
            }

            .logo {
                width: 60%;
            }

            .search-bar {
                width: 95%;
            }

            .member {
                width: 90%;
                flex-direction: row;
                min-height: 100px;
            }
        }

        @media (max-width: 480px) {
            header {
                font-size: 8vw;
            }

            .logo {
                width: 70%;
            }

            .member {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .profile-pic {
                margin-right: 0;
                margin-bottom: 10px;
            }

            .member-info {
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <header>StepInter</header>

    <div class="container">
        <img src="https://i.imgur.com/z57H6aQ.png" alt="Logo" class="logo" />
        <input type="text" class="search-bar" placeholder="Search members..." />
    </div>

    <div class="members" id="memberList"></div>

    <script>
        const members = [
            { id: 1, name: 'Zino Sabudbob', role: 'Founder', facebook: 'https://www.facebook.com/profile.php?id=61573979874520', profilePicture: 'https://i.imgur.com/o4M0Pvh.png' },
            { id: 8, name: 'Skyblue Triples', role: 'Leader', facebook: 'https://www.facebook.com/share/16L5eEajBz/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/vqaaLKs.jpeg' },
            { id: 6, name: 'Faye StepInter', role: 'Leader', facebook: 'https://www.facebook.com/Eelena.Midnight.1', profilePicture: 'https://i.imgur.com/7qZk21b.png' },
            { id: 2, name: 'Nene StepInter', role: 'Member', facebook: 'https://www.facebook.com/nenejacrazy', profilePicture: 'https://i.imgur.com/xM0kx6o.png' },
            { id: 3, name: 'Atlas StepInter', role: 'Member', facebook: 'X', profilePicture: 'https://i.imgur.com/oUjxeea.png' },
            { id: 4, name: 'March Colinfirth', role: 'Member', facebook: 'https://www.facebook.com/march.colinfirth', profilePicture: 'https://i.imgur.com/hR1TeUq.png' },
            { id: 5, name: 'Blackdora StepInter', role: 'Member', facebook: 'X', profilePicture: 'https://i.imgur.com/wM2rtaH.png' },
            { id: 7, name: 'Owen StepInter', role: 'Member', facebook: 'X', profilePicture: 'https://i.imgur.com/Bb5qHFV.jpeg' },
            { id: 9, name: 'Bunny Celestrial', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=61563982465328', profilePicture: 'https://i.imgur.com/Cxn51R3.jpeg' },
            { id: 10, name: 'Payu Raengtamlom', role: 'Member', facebook: 'https://www.facebook.com/share/19DkBQnYbx/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/GgHxciC.png' },
            { id: 11, name: 'Aina Diffstyle', role: 'Member', facebook: 'https://www.facebook.com/share/1GdHrfP5Zx/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/68BhK0W.png' },
            { id: 12, name: 'Lucas Beyondgod', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=100091115444827', profilePicture: 'https://i.imgur.com/HKgA5y6.png' },
            { id: 13, name: 'Mewie Zera', role: 'Member', facebook: 'https://www.facebook.com/share/1FWe9EKFRg/', profilePicture: 'https://i.imgur.com/ZJKT7Pe.png' },
            { id: 14, name: 'Babyz Shehot', role: 'Member', facebook: 'https://www.facebook.com/share/1BH3JvgeXu/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/l6uKAEs.png' },
            { id: 15, name: 'Conner Winterfell Smit', role: 'Member', facebook: 'https://www.facebook.com/share/1B8s5Ad8pL/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/N21tbG5.png' },
            { id: 16, name: 'Piano bubbly', role: 'Member', facebook: 'https://www.facebook.com/profile.php?id=61552154380401', profilePicture: 'https://i.imgur.com/l3rHg1R.png' },
            { id: 17, name: 'Cotton Bubbly', role: 'Member', facebook: 'https://www.facebook.com/share/1AuNodGUcu/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/D73xGRk.png' },
            { id: 18, name: 'Khaopoon Celestrial', role: 'Member', facebook: 'https://www.facebook.com/share/1CN3WenXHF/?mibextid=wwXIfr', profilePicture: 'https://i.imgur.com/KxvqU13.jpeg' }
        ];

        const memberList = document.getElementById("memberList");
        const searchBar = document.querySelector(".search-bar");

        function renderMembers(filteredMembers) {
            memberList.innerHTML = "";
            filteredMembers.forEach(member => {
                const div = document.createElement("div");
                div.classList.add("member");

                div.innerHTML = `
          <img src="${member.profilePicture}" alt="${member.name}" class="profile-pic">
          <div class="member-info">
            <div class="member-name">${member.name}</div>
            <div class="member-role">${member.role}</div>
            ${member.facebook !== 'X' ? `<a href="${member.facebook}" target="_blank" class="facebook-link">${member.facebook}</a>` : `<span style="color:#aaa;">No link</span>`}
          </div>
        `;

                memberList.appendChild(div);
            });
        }

        renderMembers(members);

        searchBar.addEventListener("input", e => {
            const searchText = e.target.value.toLowerCase();
            const filtered = members.filter(m =>
                m.name.toLowerCase().includes(searchText) ||
                m.role.toLowerCase().includes(searchText)
            );
            renderMembers(filtered);
        });
    </script>
</body>

</html>
